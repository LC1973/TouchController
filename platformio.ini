
[platformio]
default_envs = touchpanel-serial
build_dir = ${sysenv.BUILD_CACHE}/pio/TouchController/build
libdeps_dir = ${sysenv.BUILD_CACHE}/pio/TouchController/libdeps

[env:touchpanel-serial]
; pioarduino fork: official espressif32 6.x is stuck on Arduino-ESP32 2.0.17
; (ESP-IDF 4.4.7) which lacks bounce_buffer_size_px for the RGB panel.
; pioarduino ships Arduino-ESP32 3.x (ESP-IDF 5.x) where the field exists.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; Disable dependency tracking to prevent Windows temp file corruption
build_unflags = 
    -MD
    -MMD
; COM6 (UART via DIP switch selection) is your working port.
upload_port = COM4
upload_speed = 921600
; With ARDUINO_USB_CDC_ON_BOOT=0, Serial output is on UART (same COM6).
monitor_port = COM6
monitor_speed = 115200
monitor_filters = direct

; ESP32-S3 with 16MB Flash + 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb_ota.csv
board_build.filesystem = spiffs

lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.0.0
    links2004/WebSockets@2.4.1

lib_extra_dirs =
    ../ESP32-SharedLibraries/lib

build_flags =
    -DTOUCH_CONTROLLER
    -DBOARD_PROFILE_1024X600
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_INV_BUF_SIZE=256
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Iinclude


[env:touchpanel-ota]
extends = env:touchpanel-serial
upload_protocol = espota
upload_port = 192.168.1.200
upload_flags =
    --auth=otapass
    --timeout=30
    --host_port=50000
